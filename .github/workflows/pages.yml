name: Publish wallet app
on:
  push:
    branches: [codex/private-vault-feasibility]
    paths:
      - web/**
      - packages/**
      - services/runner/**
      - services/mcp/**
      - services/demo/network.mjs
      - contracts/**
      - scripts/**
      - package.json
      - package-lock.json
      - docs/images/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wallet-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bash scripts/install-compiler.sh
      - run: npm run compile
      - run: npm run check:web
      - run: npm run build:web
      - run: npm run test:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
