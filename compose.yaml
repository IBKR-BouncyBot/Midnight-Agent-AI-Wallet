# Adapted from midnightntwrk/midnight-examples (Apache-2.0).
# Disposable local development chain only. Never use these genesis identities
# or sample indexer credentials on a public network.
name: midnight-agent-wallet-feasibility
services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.3
    command: [midnight-proof-server, -v]
    ports: ['127.0.0.1:16300:6300']
    healthcheck:
      test: [CMD-SHELL, 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
  node:
    image: midnightntwrk/midnight-node:1.0.400
    ports: ['127.0.0.1:19944:9944']
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -H 'Content-Type: application/json'
          -d '{"id":1,"jsonrpc":"2.0","method":"chain_getHeader","params":[]}'
          http://localhost:9944 | grep -q '"number":"0x[1-9a-f]'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  indexer:
    image: midnightntwrk/indexer-standalone:4.3.5
    restart: on-failure
    ports: ['127.0.0.1:18088:8088']
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: ws://node:9944
      APP__APPLICATION__NETWORK_ID: undeployed
      APP__INFRA__STORAGE__PASSWORD: indexer
      APP__INFRA__PUB_SUB__PASSWORD: indexer
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: indexer
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: ws://node:9944
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: e2e-test-dummy-id
    depends_on:
      node:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
